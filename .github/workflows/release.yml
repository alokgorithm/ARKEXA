name: Release

# Publishing is triggered by a tag, and a tag is the only thing that triggers
# it. Nothing here runs on a push to main, so an accidental merge cannot ship a
# release.
#
# `v*.*` and not `v*`, so the moving major-version tag the GitHub Action is
# consumed by - `v0`, and `v1` after it - does not look like a release. That
# tag is re-pointed at every release and force-pushed; on `v*` each move fired
# this workflow, which then failed the version check and left a red run behind
# for something that was never a release attempt.
on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: read

jobs:
  # A version on PyPI can never be reused, not even after a delete. So the
  # checks that would normally run after a mistake have to run before it.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version out of the package
        id: version
        run: |
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/arkexa/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"

      - name: The tag has to match the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package version $version"
            echo "fix one of them and tag again; do not publish a mismatch"
            exit 1
          fi
          echo "tag v$tag matches the package"

      - name: Install
        run: python -m pip install --upgrade pip .

      - name: Test
        working-directory: tests
        run: python -m unittest discover -s . -t .

      - name: Rule documentation is in sync
        run: python tools/gen_rule_docs.py --check

      - name: Scan this repository with itself
        run: arkexa .

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The wheel has to contain the data files
        # Without these the tool imports and then fails on the first scan, so
        # this is worth failing the release over.
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "arkexa/data/agents.yml",
              "arkexa/data/untrusted.yml",
              "arkexa/data/guards.yml",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing {missing}")
          print(f"{wheel} carries all three data files")
          PY

      - name: Install the built wheel and run it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl
          /tmp/check/bin/arkexa --version
          /tmp/check/bin/arkexa tests/fixtures/ark001_vulnerable.yml && exit 1 || true
          echo "the built wheel scans and exits non-zero on a finding"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing. No API token is stored in this repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  moving-tag:
    # The GitHub Action is consumed as `alokgorithm/ARKEXA@v0`, so that tag has
    # to follow the newest v0.x release. Doing it here rather than by hand is
    # the point: a moving tag that someone forgets to move is worse than no
    # moving tag, because it silently pins every consumer to an old scanner.
    #
    # Runs only after publish succeeds. A tag that advertises a release which
    # never reached PyPI would send `pip install` looking for nothing.
    needs: publish
    if: startsWith(github.ref_name, 'v0.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point v0 at this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          major="${RELEASE_TAG%%.*}"          # v0.2.0 -> v0
          repo="${{ github.repository }}"
          echo "moving $major to $COMMIT ($RELEASE_TAG)"

          # The API rather than a git push, so no credential is persisted to
          # the runner's disk for a one-line ref update.
          if gh api "repos/${repo}/git/ref/tags/${major}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${repo}/git/refs/tags/${major}" \
              -f sha="$COMMIT" -F force=true >/dev/null
            echo "moved $major"
          else
            gh api -X POST "repos/${repo}/git/refs" \
              -f ref="refs/tags/${major}" -f sha="$COMMIT" >/dev/null
            echo "created $major"
          fi

          landed=$(gh api "repos/${repo}/git/ref/tags/${major}" --jq '.object.sha')
          if [ "$landed" != "$COMMIT" ]; then
            echo "$major points at $landed, expected $COMMIT"
            exit 1
          fi
          echo "$major now tracks $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
