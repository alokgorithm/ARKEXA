name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip .

      - name: Test
        working-directory: tests
        run: python -m unittest discover -s . -t . -v

      - name: Rule documentation is in sync
        run: python tools/gen_rule_docs.py --check

  action:
    # The wrapper is the adoption path, so a broken one is a broken release.
    # Runs against this repository with uploading off, because code scanning
    # is not the thing under test here - the composite steps are.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the action on this repository
        id: arkexa
        uses: ./
        with:
          upload: 'false'
          fail-on-findings: 'false'

      - name: The action produced a SARIF report
        run: |
          set -e
          test -f "${{ steps.arkexa.outputs.sarif-file }}"
          python -c "
          import json, sys
          doc = json.load(open('${{ steps.arkexa.outputs.sarif-file }}'))
          assert doc['version'] == '2.1.0', doc.get('version')
          assert doc['runs'][0]['tool']['driver']['name'] == 'ARKEXA'
          print('SARIF valid,', len(doc['runs'][0]['results']), 'result(s)')
          "

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip .

      - name: Scan this repository
        run: arkexa .

      - name: The fixtures still say what they should
        run: |
          set -e
          for rule in ARK001 ARK002 ARK003 ARK004 ARK005; do
            lower=$(echo "$rule" | tr "[:upper:]" "[:lower:]")
            if arkexa "tests/fixtures/${lower}_safe.yml" --reachability all | grep -q "$rule"; then
              echo "$rule fired on its safe fixture"
              exit 1
            fi
          done
          echo "every safe fixture is quiet"
